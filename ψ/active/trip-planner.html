<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravPlan v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&display=swap');

* { box-sizing: border-box; }
body { font-family: 'Kanit', sans-serif; background: #0a0e1a; color: #e5e7eb; margin: 0; min-height: 100vh; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: #374151; border-radius: 999px; }

/* ---- Screens ---- */
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ---- Bottom Sheet ---- */
.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  z-index: 40; display: none; backdrop-filter: blur(2px);
}
.backdrop.open { display: block; }
.sheet {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 640px;
  background: #131826; border-radius: 1.5rem 1.5rem 0 0;
  z-index: 50; transition: transform 0.28s cubic-bezier(.32,.72,0,1);
  max-height: 92vh; overflow-y: auto;
}
.sheet.open { transform: translateX(-50%) translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; background: #374151;
  border-radius: 99px; margin: 12px auto 0;
}

/* ---- Type buttons ---- */
.type-btn {
  border: 2px solid #1f2937; border-radius: 12px;
  padding: 8px 4px; text-align: center; cursor: pointer;
  transition: all 0.15s; background: transparent;
}
.type-btn.sel { border-color: var(--tc); background: var(--tbg); }

/* ---- Block card ---- */
.block-card {
  border-left: 3px solid; border-radius: 12px;
  background: #0d1220; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: background 0.12s;
}
.block-card:active { background: #111827; }

/* ---- Checkbox ---- */
.chk {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid #374151;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; transition: all 0.15s; font-size: 12px;
}
.chk.on { color: #0a0e1a; }

/* ---- Input ---- */
.inp {
  width: 100%; background: #0a0e1a; border: 1.5px solid #1f2937;
  border-radius: 12px; padding: 10px 14px; font-size: 14px;
  font-family: 'Kanit', sans-serif; color: #e5e7eb; outline: none;
  transition: border-color 0.15s;
}
.inp:focus { border-color: #f59e0b66; }
.inp::placeholder { color: #374151; }

/* ---- Label ---- */
.lbl { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; display: block; }

/* ---- Mini timeline bar ---- */
.mini-bar {
  position: relative; height: 24px; background: #0a0e1a;
  border-radius: 8px; overflow: hidden; border: 1px solid #1f2937;
}
.mini-bar-grid {
  position: absolute; inset: 0; display: flex; pointer-events: none;
}
.mini-bar-grid > div { flex: 1; border-right: 1px solid #ffffff08; }
.mini-bar-grid > div:last-child { border-right: none; }
/* span = thin top strip (transit, hotel, continuation) */
.mini-seg { position: absolute; border-radius: 3px; min-width: 3px; box-shadow: 0 0 0 1px #0a0e1a; }
.mini-seg.span { top: 2px; height: 7px; }
/* event = taller bottom strip (food, activity, sleep, free) */
.mini-seg.event { bottom: 2px; height: 13px; }

/* ---- FAB ---- */
.fab {
  position: fixed; bottom: 28px; right: 16px;
  width: 52px; height: 52px; border-radius: 50%;
  background: #f59e0b; color: #0a0e1a;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; z-index: 20;
  box-shadow: 0 4px 24px #f59e0b44; cursor: pointer;
  border: none; font-family: 'Kanit', sans-serif;
  transition: transform 0.1s, background 0.1s;
}
.fab:active { transform: scale(0.93); background: #fbbf24; }

/* ---- Animations ---- */
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeIn 0.2s ease; }

/* ---- Plan card ---- */
.plan-card {
  background: #131826; border-radius: 16px; padding: 16px;
  cursor: pointer; transition: background 0.15s; border: 1.5px solid #1f2937;
}
.plan-card:active { background: #1a2233; }

/* ---- Day row ---- */
.day-row { background: #131826; border-radius: 16px; overflow: hidden; }
</style>
</head>
<body>
<div class="max-w-[640px] mx-auto pb-28">

<!-- ═══════════════════════════════════════
     SCREEN: HOME
═══════════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="px-5 pt-10 pb-5">
    <div class="text-3xl font-light text-white">Trav<span class="font-bold text-amber-400">Plan</span></div>
    <div class="text-slate-500 text-sm mt-0.5">วางแผนการเดินทาง</div>
  </div>

  <div id="home-list" class="px-4 space-y-3"></div>

  <div id="home-empty" class="hidden text-center py-20 px-8">
    <div class="text-5xl mb-4">🗺️</div>
    <div class="text-slate-400 font-medium">ยังไม่มีแผนการเดินทาง</div>
    <div class="text-slate-600 text-sm mt-1">กด + เพื่อสร้างแผนใหม่</div>
  </div>

  <button class="fab" onclick="openPlanSheet()">+</button>
</div>

<!-- ═══════════════════════════════════════
     SCREEN: PLAN
═══════════════════════════════════════ -->
<div id="screen-plan" class="screen">

  <!-- Sticky header -->
  <div class="sticky top-0 z-20 bg-[#0a0e1a]/95 backdrop-blur border-b border-white/5">
    <div class="flex items-center gap-3 px-4 py-3">
      <button onclick="navigate('home')" class="w-8 h-8 flex items-center justify-center text-slate-400 text-xl">‹</button>
      <div class="flex-1 min-w-0">
        <div id="plan-title" class="font-semibold text-sm text-white truncate"></div>
        <div id="plan-meta" class="text-slate-500 text-xs"></div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="exportPDF()" class="text-slate-500 text-xs px-2 py-1 rounded-lg hover:bg-white/5 transition-all" title="ส่งออก PDF">↓PDF</button>
        <button onclick="duplicatePlan()" class="text-slate-500 text-xs px-2 py-1 rounded-lg hover:bg-white/5 transition-all" title="คัดลอกแผน">⧉</button>
        <button onclick="openPlanSheet(currentPlanId)" class="text-slate-500 text-xs px-2 py-1 rounded-lg hover:bg-white/5 transition-all">แก้ไข</button>
      </div>
    </div>
    <!-- Cost summary -->
    <div class="px-4 pb-2">
      <div class="bg-[#131826] rounded-xl px-4 py-2.5 flex items-center justify-between border border-white/5">
        <div class="flex items-center gap-2">
          <span class="text-slate-500 text-xs">รวมที่เลือก</span>
          <span id="plan-total" class="text-amber-400 font-bold text-base">฿0</span>
        </div>
        <div class="flex items-center gap-3">
          <div id="plan-per-person" class="text-slate-600 text-xs"></div>
          <button id="undo-btn" onclick="undo()" class="opacity-30 text-slate-400 text-xs px-2 py-1 rounded-lg hover:bg-white/5 transition-all" title="ย้อนกลับ">↩ undo</button>
        </div>
      </div>
    </div>
    <!-- Tab bar -->
    <div class="flex px-4 pb-2 gap-2">
      <button id="tab-timeline" onclick="setPlanView('timeline')"
        class="flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all bg-amber-400 text-[#0a0e1a]">ไทม์ไลน์</button>
      <button id="tab-summary" onclick="setPlanView('summary')"
        class="flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all bg-white/5 text-slate-400">สรุปค่าใช้จ่าย</button>
    </div>
  </div>

  <div id="day-rows" class="px-4 pt-3 space-y-3"></div>
  <div id="summary-view" class="hidden px-4 pt-3 pb-24"></div>

  <button class="fab" onclick="openBlockSheet(null, null)">+</button>
</div>

<!-- ═══════════════════════════════════════
     SHEET: PLAN
═══════════════════════════════════════ -->
<div id="plan-backdrop" class="backdrop" onclick="closePlanSheet()"></div>
<div id="plan-sheet" class="sheet">
  <div class="sheet-handle"></div>
  <div class="p-5 pt-4">
    <div class="flex items-center justify-between mb-5">
      <h2 id="plan-sheet-title" class="font-bold text-lg text-white">สร้างแผนใหม่</h2>
      <button onclick="closePlanSheet()" class="w-8 h-8 rounded-full bg-white/5 text-slate-400 flex items-center justify-center">✕</button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="lbl">ชื่อแผน</label>
        <input id="ps-name" class="inp" type="text" placeholder="เช่น เชียงใหม่ พ.ค. 69">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="lbl">วันเริ่ม</label>
          <input id="ps-start" class="inp" type="text" placeholder="วว/ดด/ปปปป" maxlength="10" oninput="fmtDate(this)">
        </div>
        <div>
          <label class="lbl">วันจบ</label>
          <input id="ps-end" class="inp" type="text" placeholder="วว/ดด/ปปปป" maxlength="10" oninput="fmtDate(this)">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="lbl">ผู้ใหญ่ (หารค่าใช้จ่าย)</label>
          <input id="ps-adults" class="inp" type="number" min="1" value="2">
        </div>
        <div>
          <label class="lbl">เด็ก (ไม่หาร)</label>
          <input id="ps-children" class="inp" type="number" min="0" value="0" placeholder="0">
        </div>
      </div>
      <div>
        <label class="lbl">Budget/ผู้ใหญ่ 1 คน (฿)</label>
        <input id="ps-budget" class="inp" type="number" min="0" placeholder="ไม่ระบุ">
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button id="ps-del-btn" onclick="deletePlan()" class="hidden px-4 py-2.5 rounded-xl text-red-400 text-sm hover:bg-red-900/20 transition-all">ลบแผน</button>
      <button onclick="savePlan()" class="flex-1 bg-amber-400 text-[#0a0e1a] font-bold py-2.5 rounded-xl hover:bg-amber-300 transition-all">บันทึก</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     SHEET: BLOCK
═══════════════════════════════════════ -->
<div id="block-backdrop" class="backdrop"></div>
<div id="block-sheet" class="sheet">
  <div class="sheet-handle"></div>
  <div class="p-5 pt-4">
    <div class="flex items-center justify-between mb-4">
      <h2 id="block-sheet-title" class="font-bold text-lg text-white">เพิ่มบล็อค</h2>
      <button onclick="closeBlockSheet()" class="w-8 h-8 rounded-full bg-white/5 text-slate-400 flex items-center justify-center">✕</button>
    </div>

    <!-- Type selector -->
    <div class="grid grid-cols-3 gap-2 mb-4" id="type-btns">
      <button class="type-btn" data-type="transit" onclick="setType('transit')" style="--tc:#3b82f6;--tbg:#3b82f611">
        <div class="text-lg">🚌</div><div class="text-[9px] mt-0.5 text-slate-400">เดินทาง</div>
      </button>
      <button class="type-btn" data-type="hotel" onclick="setType('hotel')" style="--tc:#f97316;--tbg:#f9731611">
        <div class="text-lg">🏨</div><div class="text-[9px] mt-0.5 text-slate-400">ที่พัก</div>
      </button>
      <button class="type-btn" data-type="food" onclick="setType('food')" style="--tc:#eab308;--tbg:#eab30811">
        <div class="text-lg">🍜</div><div class="text-[9px] mt-0.5 text-slate-400">ร้านอาหาร</div>
      </button>
      <button class="type-btn" data-type="activity" onclick="setType('activity')" style="--tc:#22c55e;--tbg:#22c55e11">
        <div class="text-lg">🎫</div><div class="text-[9px] mt-0.5 text-slate-400">กิจกรรม</div>
      </button>
      <button class="type-btn" data-type="sleep" onclick="setType('sleep')" style="--tc:#475569;--tbg:#47556911">
        <div class="text-lg">😴</div><div class="text-[9px] mt-0.5 text-slate-400">นอน</div>
      </button>
      <button class="type-btn" data-type="free" onclick="setType('free')" style="--tc:#6b7280;--tbg:#6b728011">
        <div class="text-lg">⏸</div><div class="text-[9px] mt-0.5 text-slate-400">ว่าง</div>
      </button>
    </div>

    <div class="space-y-3">
      <!-- Label -->
      <div>
        <label class="lbl">ชื่อ / Label</label>
        <input id="bs-label" class="inp" type="text" placeholder="">
      </div>

      <!-- Date + Cost (always shown) -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="lbl">วันที่</label>
          <div class="flex items-center gap-1">
            <button type="button" onclick="shiftDate(-1)" class="w-7 h-8 flex items-center justify-center rounded-lg bg-white/5 text-slate-400 hover:bg-white/10 active:scale-95 text-sm shrink-0">◀</button>
            <input id="bs-date" class="inp flex-1 text-center" type="text" placeholder="วว/ดด/ปปปป" maxlength="10" oninput="fmtDate(this)">
            <button type="button" onclick="shiftDate(1)" class="w-7 h-8 flex items-center justify-center rounded-lg bg-white/5 text-slate-400 hover:bg-white/10 active:scale-95 text-sm shrink-0">▶</button>
          </div>
        </div>
        <div id="bs-cost-wrap">
          <label class="lbl">ค่าใช้จ่าย (฿)</label>
          <input id="bs-cost" class="inp" type="text" placeholder="เช่น 957+857+1038+938" oninput="previewCost(this)">
          <div id="bs-cost-preview" class="text-amber-400 text-xs mt-1 font-bold hidden"></div>
        </div>
      </div>

      <!-- TRANSIT fields -->
      <div id="f-transit" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lbl">จาก</label>
            <input id="bs-from" class="inp" type="text" placeholder="ต้นทาง">
          </div>
          <div>
            <label class="lbl">ไป</label>
            <input id="bs-to" class="inp" type="text" placeholder="ปลายทาง">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lbl">เวลาออก</label>
            <input id="bs-t-start" class="inp" type="time">
          </div>
          <div>
            <label class="lbl">เวลาถึง</label>
            <input id="bs-t-end" class="inp" type="time">
          </div>
        </div>
      </div>

      <!-- HOTEL fields -->
      <div id="f-hotel" class="hidden space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lbl">เช็คอิน</label>
            <input id="bs-checkin" class="inp" type="time" value="14:00">
          </div>
          <div>
            <label class="lbl">เช็คเอาท์</label>
            <input id="bs-checkout" class="inp" type="time" value="11:00">
          </div>
        </div>
        <div>
          <label class="lbl">จำนวนคืน</label>
          <input id="bs-nights" class="inp" type="number" min="1" value="1">
        </div>
      </div>

      <!-- ACTIVITY / SLEEP / FREE: time range -->
      <div id="f-time" class="hidden">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lbl">เริ่ม</label>
            <input id="bs-a-start" class="inp" type="time">
          </div>
          <div>
            <label class="lbl">จบ</label>
            <input id="bs-a-end" class="inp" type="time">
          </div>
        </div>
      </div>

      <!-- Note -->
      <div>
        <label class="lbl">หมายเหตุ</label>
        <input id="bs-note" class="inp" type="text" placeholder="(ไม่บังคับ)">
      </div>
    </div>

    <div class="flex gap-3 mt-5">
      <button id="bs-del-btn" onclick="deleteBlock()" class="hidden px-4 py-2.5 rounded-xl text-red-400 text-sm hover:bg-red-900/20 transition-all">ลบ</button>
      <button onclick="saveBlock()" class="flex-1 bg-amber-400 text-[#0a0e1a] font-bold py-2.5 rounded-xl hover:bg-amber-300 transition-all">บันทึก</button>
    </div>
  </div>
</div>

</div><!-- /max-w container -->

<script>
// ─────────────────────────────────
// TYPE CONFIG
// ─────────────────────────────────
const TC = {
  transit:  { icon: '🚌', label: 'เดินทาง',    color: '#3b82f6' },
  hotel:    { icon: '🏨', label: 'ที่พัก',      color: '#f97316' },
  food:     { icon: '🍜', label: 'ร้านอาหาร',  color: '#eab308' },
  activity: { icon: '🎫', label: 'กิจกรรม',    color: '#22c55e' },
  sleep:    { icon: '😴', label: 'นอน',         color: '#475569' },
  free:     { icon: '⏸',  label: 'ว่าง',        color: '#6b7280' },
};
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAYS   = ['อา','จ','อ','พ','พฤ','ศ','ส'];

// ─────────────────────────────────
// STATE
// ─────────────────────────────────
let data = { plans: [] };
let currentPlanId  = null;
let editingPlanId  = null;
let editingBlockId = null;
let blockType      = 'transit';
let blockDateHint  = null;
let planView       = 'timeline';
let summaryFilter  = 'selected'; // 'selected' | 'all' | 'paid'

// ─────────────────────────────────
// STORAGE
// ─────────────────────────────────
function load() {
  try { const s = localStorage.getItem('tp2'); if (s) data = JSON.parse(s); } catch(e) {}
}
const undoStack = [];
function save() {
  undoStack.push(JSON.stringify(data));
  if (undoStack.length > 30) undoStack.shift();
  localStorage.setItem('tp2', JSON.stringify(data));
  document.getElementById('undo-btn')?.classList.toggle('opacity-30', undoStack.length <= 1);
}
function undo() {
  if (undoStack.length <= 1) return;
  undoStack.pop();
  const prev = undoStack[undoStack.length - 1];
  data = JSON.parse(prev);
  localStorage.setItem('tp2', prev);
  document.getElementById('undo-btn')?.classList.toggle('opacity-30', undoStack.length <= 1);
  renderPlan();
}
function uid()  { return Math.random().toString(36).slice(2, 9); }

// ─────────────────────────────────
// NAVIGATION
// ─────────────────────────────────
function navigate(view, planId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + view).classList.add('active');
  window.scrollTo(0, 0);

  if (view === 'home') {
    currentPlanId = null;
    renderHome();
  } else if (view === 'plan' && planId) {
    currentPlanId = planId;
    renderPlan();
  }
}

// ─────────────────────────────────
// HOME
// ─────────────────────────────────
function renderHome() {
  const list  = document.getElementById('home-list');
  const empty = document.getElementById('home-empty');

  if (!data.plans.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  list.innerHTML = data.plans.map(plan => {
    const total    = planTotal(plan);
    const checked  = (plan.blocks || []).filter(b => b.on).length;
    const allBlocks= (plan.blocks || []).length;
    const adults   = plan.adults ?? plan.travelers ?? 1;
    const children = plan.children || 0;
    const budget   = (plan.budget || 0) * adults;
    const dStr     = dateRangeStr(plan.startDate, plan.endDate);
    const pct      = budget ? Math.min(100, (total / budget) * 100) : 0;
    const over     = budget && total > budget;
    const peopleStr = children > 0 ? `${adults} ผู้ใหญ่ + ${children} เด็ก` : `${adults} คน`;

    return `
    <div class="plan-card fade-in" onclick="navigate('plan','${plan.id}')">
      <div class="flex items-start justify-between">
        <div class="min-w-0 flex-1">
          <div class="font-semibold text-white truncate">${esc(plan.name || 'แผนใหม่')}</div>
          <div class="text-slate-500 text-xs mt-0.5">${dStr} · ${peopleStr}</div>
        </div>
        <div class="text-right ml-3 shrink-0">
          <div class="text-amber-400 font-bold">฿${fmt(total)}</div>
          <div class="text-slate-600 text-xs">${checked}/${allBlocks} บล็อค</div>
        </div>
      </div>
      ${budget ? `
      <div class="mt-3">
        <div class="bg-[#0a0e1a] rounded-full h-1.5 overflow-hidden">
          <div class="h-full rounded-full ${over ? 'bg-red-500' : 'bg-emerald-500'}" style="width:${pct}%;transition:width 0.3s"></div>
        </div>
        <div class="flex justify-between mt-1 text-[10px] text-slate-600">
          <span>Budget ฿${fmt(budget)}</span>
          <span>${over ? 'เกิน' : 'เหลือ'} ฿${fmt(Math.abs(budget - total))}</span>
        </div>
      </div>` : ''}
    </div>`;
  }).join('');
}

// ─────────────────────────────────
// PLAN VIEW
// ─────────────────────────────────
function renderPlan() {
  const plan = getPlan();
  if (!plan) return navigate('home');

  document.getElementById('plan-title').textContent = plan.name || 'แผนใหม่';
  const adults   = plan.adults ?? plan.travelers ?? 1;
  const children = plan.children || 0;
  const peopleStr = children > 0 ? `${adults} ผู้ใหญ่ + ${children} เด็ก` : `${adults} คน`;
  document.getElementById('plan-meta').textContent = `${dateRangeStr(plan.startDate, plan.endDate)} · ${peopleStr}`;

  const total = planTotal(plan);
  document.getElementById('plan-total').textContent = `฿${fmt(total)}`;
  document.getElementById('plan-per-person').textContent =
    adults > 1 ? `฿${fmt(Math.round(total / adults))}/คน` : '';

  document.getElementById('day-rows').classList.toggle('hidden', planView !== 'timeline');
  document.getElementById('summary-view').classList.toggle('hidden', planView !== 'summary');
  document.getElementById('tab-timeline').className = `flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all ${planView === 'timeline' ? 'bg-amber-400 text-[#0a0e1a]' : 'bg-white/5 text-slate-400'}`;
  document.getElementById('tab-summary').className  = `flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all ${planView === 'summary'  ? 'bg-amber-400 text-[#0a0e1a]' : 'bg-white/5 text-slate-400'}`;

  if (planView === 'summary') { renderSummary(plan); return; }

  const container = document.getElementById('day-rows');
  if (!plan.startDate) {
    container.innerHTML = '<p class="text-slate-600 text-center text-sm py-10">กำหนดวันเดินทางก่อนเพิ่มบล็อค</p>';
    return;
  }

  const dates = dateRange(plan.startDate, plan.endDate);
  const dateSet = new Set(dates);
  const orphans = (plan.blocks || []).filter(b => !dateSet.has(b.date));

  let html = dates.map(d => renderDayRow(plan, d)).join('');

  if (orphans.length) {
    html += `
    <div class="mx-4 my-3 p-3 rounded-xl border border-red-500/30 bg-red-500/5">
      <div class="text-red-400 text-xs font-semibold mb-2">⚠️ บล็อคนอกช่วงทริป (${orphans.length} รายการ) — กดเพื่อแก้วันที่</div>
      <div class="space-y-2">
        ${orphans.map(b => {
          const cfg = TC[b.type] || TC.free;
          const dateLabel = b.date ? isoToThai(b.date) : 'ไม่มีวันที่';
          return `<div class="block-card cursor-pointer" style="border-color:${cfg.color};opacity:0.7" onclick="openBlockSheet('${b.id}')">
            <div class="text-xl shrink-0">${cfg.icon}</div>
            <div class="flex-1 min-w-0">
              <div class="text-white text-sm font-medium truncate">${esc(b.label || cfg.label)}</div>
              <div class="text-red-400 text-xs">${dateLabel}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  container.innerHTML = html;
}

function setPlanView(v) {
  planView = v;
  renderPlan();
}

let summaryExpanded = {};

function toggleSummaryGroup(type) {
  summaryExpanded[type] = !summaryExpanded[type];
  const el = document.getElementById('sg-' + type);
  if (!el) return;
  el.classList.toggle('hidden', !summaryExpanded[type]);
  document.getElementById('sg-arrow-' + type).textContent = summaryExpanded[type] ? '▲' : '▼';
}

function renderSummary(plan) {
  const blocks = plan.blocks || [];
  const adults = plan.adults ?? plan.travelers ?? 1;

  const filters = {
    selected: blocks.filter(b => b.on),
    all:      blocks,
    paid:     blocks.filter(b => b.paid),
  };
  const labels = { selected: 'ที่เลือก', all: 'ทั้งหมด', paid: 'จ่ายแล้ว' };
  const active = filters[summaryFilter];
  const grandTotal = active.reduce((s, b) => s + evalExpr(String(b.cost ?? '')), 0);

  const groups = {};
  for (const b of active) {
    if (!groups[b.type]) groups[b.type] = { total: 0, items: [] };
    groups[b.type].total += evalExpr(String(b.cost ?? ''));
    groups[b.type].items.push(b);
  }
  for (const g of Object.values(groups)) {
    g.items.sort((a, b) => {
      const dateA = a.date || '', dateB = b.date || '';
      if (dateA !== dateB) return dateA < dateB ? -1 : 1;
      return toMin(startTime(a)) - toMin(startTime(b));
    });
  }

  const rows = Object.entries(TC).map(([type, cfg]) => {
    const g = groups[type];
    if (!g) return '';
    const pct  = grandTotal > 0 ? g.total / grandTotal * 100 : 0;
    const open = summaryExpanded[type];

    const itemRows = g.items.map(b => {
      const cost = evalExpr(String(b.cost ?? ''));
      const timeStr = blockTimeStr(b);
      return `
      <div class="flex items-center gap-2 py-2 border-t border-white/5 cursor-pointer hover:bg-white/3 rounded px-1"
           onclick="setPlanView('timeline');setTimeout(()=>openBlockSheet('${b.id}'),80)">
        <div class="flex-1 min-w-0">
          <div class="text-white text-xs font-medium truncate">${esc(b.label || cfg.label)}</div>
          <div class="text-slate-600 text-[10px]">${esc(timeStr)} ${b.paid ? '· 💳' : ''}</div>
        </div>
        <div class="text-xs font-semibold shrink-0" style="color:${b.on ? cfg.color : '#4b5563'}">฿${fmt(cost)}</div>
      </div>`;
    }).join('');

    return `
    <div class="bg-[#131826] rounded-xl border border-white/5 overflow-hidden">
      <div class="flex items-center justify-between p-4 cursor-pointer select-none"
           onclick="toggleSummaryGroup('${type}')">
        <div class="flex items-center gap-2">
          <span class="text-lg">${cfg.icon}</span>
          <span class="text-white text-sm font-medium">${cfg.label}</span>
          <span class="text-slate-600 text-xs">${g.items.length} รายการ</span>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-right">
            <div class="font-bold text-sm" style="color:${cfg.color}">฿${fmt(g.total)}</div>
            ${adults > 1 ? `<div class="text-slate-600 text-xs">฿${fmt(Math.round(g.total/adults))}/คน</div>` : ''}
          </div>
          <span id="sg-arrow-${type}" class="text-slate-600 text-[10px]">${open ? '▲' : '▼'}</span>
        </div>
      </div>
      <div class="px-4 pb-2">
        <div class="h-1.5 rounded-full bg-white/5 overflow-hidden">
          <div class="h-full rounded-full" style="width:${pct.toFixed(1)}%;background:${cfg.color};opacity:0.7"></div>
        </div>
      </div>
      <div id="sg-${type}" class="${open ? '' : 'hidden'} px-4 pb-3">${itemRows}</div>
    </div>`;
  }).filter(Boolean).join('');

  const filterBtns = Object.keys(filters).map(k => `
    <button onclick="summaryFilter='${k}';renderPlan()"
      class="flex-1 py-1 rounded-lg text-xs font-semibold transition-all ${summaryFilter === k ? 'bg-white/15 text-white' : 'text-slate-500'}">
      ${labels[k]}
    </button>`).join('');

  document.getElementById('summary-view').innerHTML = `
    <div class="flex gap-1 bg-[#131826] rounded-xl p-1 mb-4 border border-white/5">${filterBtns}</div>
    <div class="bg-[#131826] rounded-xl px-4 py-3 mb-4 border border-white/5 flex items-center justify-between">
      <span class="text-slate-400 text-xs">รวม${labels[summaryFilter]}</span>
      <div class="text-right">
        <div class="text-amber-400 font-bold text-lg">฿${fmt(grandTotal)}</div>
        ${adults > 1 ? `<div class="text-slate-500 text-xs">฿${fmt(Math.round(grandTotal/adults))}/คน</div>` : ''}
      </div>
    </div>
    <div class="space-y-3 pb-24">${rows || '<p class="text-slate-600 text-center text-sm py-6">ไม่มีข้อมูล</p>'}</div>
  `;
}

function renderDayRow(plan, date) {
  const d      = new Date(date + 'T12:00:00');
  const blocks = (plan.blocks || [])
    .filter(b => b.date === date)
    .sort((a, b) => toMin(startTime(a)) - toMin(startTime(b)));
  const daySum = blocks.filter(b => b.on).reduce((s, b) => s + (Number(b.cost)||0), 0);

  // overnight continuations
  const contBlocks = (plan.blocks || [])
    .filter(b => {
      if (b.type === 'hotel') {
        if (b.date >= date) return false;
        return addDays(b.date, b.nights || 1) >= date;
      }
      return b.date === prevDate(date) && isOvernight(b);
    })
    .map(b => {
      if (b.type === 'hotel') {
        const isLastDay = addDays(b.date, b.nights || 1) === date;
        return { ...b, _cont: true, _hotelLastDay: isLastDay };
      }
      return { ...b, _cont: true };
    });

  const dayLabel = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;

  return `
  <div class="day-row fade-in">
    <!-- header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-white/5">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-[#0a0e1a] flex flex-col items-center justify-center border border-white/5">
          <span class="text-amber-400 text-[8px] font-bold leading-none">${DAYS[d.getDay()]}</span>
          <span class="text-white text-base font-bold leading-none">${d.getDate()}</span>
        </div>
        <span class="text-slate-400 text-xs">${MONTHS[d.getMonth()]}</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="${daySum > 0 ? 'text-amber-400 text-sm font-bold' : 'text-slate-600 text-sm font-bold'}">฿${fmt(daySum)}</span>
        <button onclick="openBlockSheet(null,'${date}')"
          class="w-7 h-7 rounded-full border border-amber-400/30 text-amber-400 flex items-center justify-center text-lg leading-none hover:bg-amber-400/10 transition-all">+</button>
      </div>
    </div>

    <!-- mini 24h bar -->
    <div class="px-4 pt-2.5 pb-1">
      <div class="mini-bar">
        <div class="mini-bar-grid">
          <div></div><div></div><div></div><div></div><div></div>
        </div>
        ${[...contBlocks, ...blocks].map(b => {
          const isCont = b._cont;
          const isSpan = isCont || b.type === 'transit' || b.type === 'hotel';
          const s  = isCont ? 0 : toMin(startTime(b));
          const e  = endMin(b, isCont);
          const lp = (s / 1440 * 100).toFixed(1);
          const wp = Math.max(0.8, ((e - s) / 1440 * 100)).toFixed(1);
          const op = isCont ? '0.45' : b.on ? (isSpan ? '0.65' : '0.9') : '0.2';
          const cls = isSpan ? 'span' : 'event';
          return `<div class="mini-seg ${cls}" style="left:${lp}%;width:${wp}%;background:${TC[b.type]?.color||'#6b7280'};opacity:${op}"></div>`;
        }).join('')}
      </div>
      <div class="flex justify-between text-[10px] font-mono font-semibold text-slate-500 mt-0.5 px-0.5">
        <span>0</span><span>6</span><span>12</span><span>18</span><span>24</span>
      </div>
    </div>

    <!-- block cards -->
    <div class="px-4 pb-3 space-y-2 mt-1">
      ${blocks.length
        ? blocks.map(b => renderBlockCard(b)).join('')
        : `<div class="text-slate-700 text-xs text-center py-2">— กด + เพื่อเพิ่มบล็อค —</div>`}
    </div>
  </div>`;
}

function renderBlockCard(b) {
  const cfg     = TC[b.type] || TC.free;
  const timeStr = blockTimeStr(b);
  const costVal = evalExpr(String(b.cost ?? ''));
  const costStr = (b.cost !== '' && b.cost != null) ? `฿${fmt(costVal)}` : '';
  const detail  = [timeStr, b.note].filter(Boolean).join(' · ');

  return `
  <div class="block-card" style="border-color:${cfg.color}" onclick="openBlockSheet('${b.id}')">
    <div class="text-xl shrink-0">${cfg.icon}</div>
    <div class="flex-1 min-w-0">
      <div class="text-white text-sm font-medium truncate">${esc(b.label || cfg.label)}</div>
      ${detail ? `<div class="text-slate-500 text-xs truncate">${esc(detail)}</div>` : ''}
    </div>
    <div class="flex items-center gap-2 shrink-0">
      ${costStr ? `<span class="text-sm font-bold" style="color:${b.on ? cfg.color : (costVal === 0 ? '#374151' : '#4b5563')}">${costStr}</span>` : ''}
      <div title="${b.paid ? 'จ่ายแล้ว' : 'ยังไม่จ่าย'}"
           onclick="event.stopPropagation();togglePaid('${b.id}')"
           style="font-size:14px;opacity:${b.paid ? '1' : '0.2'};cursor:pointer;line-height:1" title="">💳</div>
      <div class="chk ${b.on ? 'on' : ''}"
           style="${b.on ? `background:${cfg.color};border-color:${cfg.color}` : ''}"
           onclick="event.stopPropagation();toggleBlock('${b.id}')">
        ${b.on ? '✓' : ''}
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────
// PLAN SHEET
// ─────────────────────────────────
function openPlanSheet(planId) {
  editingPlanId = planId || null;
  const plan = planId ? getPlan(planId) : null;

  document.getElementById('plan-sheet-title').textContent = plan ? 'แก้ไขแผน' : 'สร้างแผนใหม่';
  document.getElementById('ps-name').value      = plan?.name      || '';
  document.getElementById('ps-start').value     = isoToThai(plan?.startDate || '');
  document.getElementById('ps-end').value       = isoToThai(plan?.endDate   || '');
  document.getElementById('ps-adults').value   = plan?.adults   ?? plan?.travelers ?? 2;
  document.getElementById('ps-children').value = plan?.children ?? 0;
  document.getElementById('ps-budget').value    = plan?.budget    || '';
  document.getElementById('ps-del-btn').classList.toggle('hidden', !plan);

  open('plan');
}
function closePlanSheet() { close('plan'); }

function savePlan() {
  const name      = document.getElementById('ps-name').value.trim();
  const startDate = thaiToISO(document.getElementById('ps-start').value);
  const endDate   = thaiToISO(document.getElementById('ps-end').value);
  const adults   = parseInt(document.getElementById('ps-adults').value)   || 1;
  const children = parseInt(document.getElementById('ps-children').value) || 0;
  const budget   = parseFloat(document.getElementById('ps-budget').value) || 0;

  if (editingPlanId) {
    const plan = getPlan(editingPlanId);
    if (plan) Object.assign(plan, { name, startDate, endDate, adults, children, budget });
    save(); closePlanSheet();
    if (currentPlanId === editingPlanId) renderPlan();
    else navigate('plan', editingPlanId);
  } else {
    const plan = { id: uid(), name, startDate, endDate, adults, children, budget, blocks: [] };
    data.plans.unshift(plan);
    save(); closePlanSheet();
    navigate('plan', plan.id);
  }
}

function deletePlan() {
  if (!editingPlanId || !confirm('ลบแผนนี้?')) return;
  data.plans = data.plans.filter(p => p.id !== editingPlanId);
  save(); closePlanSheet(); navigate('home');
}

// ─────────────────────────────────
// BLOCK SHEET
// ─────────────────────────────────
function openBlockSheet(blockId, date) {
  editingBlockId = blockId || null;
  blockDateHint  = date || null;

  const plan  = getPlan();
  const block = blockId ? (plan?.blocks || []).find(b => b.id === blockId) : null;

  document.getElementById('block-sheet-title').textContent = block ? 'แก้ไขบล็อค' : 'เพิ่มบล็อค';
  document.getElementById('bs-del-btn').classList.toggle('hidden', !block);

  setType(block?.type || 'transit');

  document.getElementById('bs-label').value    = block?.label    || '';
  document.getElementById('bs-date').value     = isoToThai(block?.date || date || plan?.startDate || '');
  document.getElementById('bs-cost').value     = block?.costExpr || block?.cost || '';
  document.getElementById('bs-cost-preview').classList.add('hidden');
  if (block?.costExpr) previewCost(document.getElementById('bs-cost'));
  document.getElementById('bs-note').value     = block?.note     || '';
  document.getElementById('bs-from').value     = block?.from     || '';
  document.getElementById('bs-to').value       = block?.to       || '';
  document.getElementById('bs-t-start').value  = block?.startTime|| '';
  document.getElementById('bs-t-end').value    = block?.endTime  || '';
  document.getElementById('bs-checkin').value  = block?.checkinTime  || '14:00';
  document.getElementById('bs-checkout').value = block?.checkoutTime || '11:00';
  document.getElementById('bs-nights').value   = block?.nights || 1;
  document.getElementById('bs-a-start').value  = block?.startTime|| '';
  document.getElementById('bs-a-end').value    = block?.endTime  || '';

  open('block');
}
function closeBlockSheet() { close('block'); }

function setType(type) {
  blockType = type;
  document.querySelectorAll('#type-btns .type-btn').forEach(btn => {
    const active = btn.dataset.type === type;
    btn.classList.toggle('sel', active);
  });
  document.getElementById('bs-label').placeholder = TC[type]?.label || '';
  document.getElementById('f-transit').classList.toggle('hidden', type !== 'transit');
  document.getElementById('f-hotel').classList.toggle('hidden', type !== 'hotel');
  document.getElementById('f-time').classList.toggle('hidden', !['activity','food','sleep','free'].includes(type));
  document.getElementById('bs-cost-wrap').classList.toggle('hidden', ['sleep','free'].includes(type));
}

function saveBlock() {
  const plan = getPlan();
  if (!plan) return;

  const type  = blockType;
  const label = document.getElementById('bs-label').value.trim();
  const date  = thaiToISO(document.getElementById('bs-date').value);
  const costRaw  = document.getElementById('bs-cost').value.trim();
  const cost     = evalExpr(costRaw);
  const costExpr = costRaw !== String(cost) ? costRaw : '';
  const note  = document.getElementById('bs-note').value.trim();

  const b = { type, date, cost, costExpr, note };

  // label: auto-generate for transit if empty
  if (type === 'transit') {
    const from = document.getElementById('bs-from').value.trim();
    const to   = document.getElementById('bs-to').value.trim();
    b.from      = from;
    b.to        = to;
    b.startTime = document.getElementById('bs-t-start').value;
    b.endTime   = document.getElementById('bs-t-end').value;
    b.label     = label || (from && to ? `${from} → ${to}` : TC.transit.label);
  } else if (type === 'hotel') {
    b.checkinTime  = document.getElementById('bs-checkin').value  || '14:00';
    b.checkoutTime = document.getElementById('bs-checkout').value || '11:00';
    b.nights       = parseInt(document.getElementById('bs-nights').value) || 1;
    b.startTime    = b.checkinTime;
    b.label        = label || TC.hotel.label;
  } else if (['activity','food','sleep','free'].includes(type)) {
    b.startTime = document.getElementById('bs-a-start').value;
    b.endTime   = document.getElementById('bs-a-end').value;
    b.label     = label || TC[type]?.label || '';
  } else {
    b.label = label || TC[type]?.label || '';
  }

  // validate date is within trip range
  if (date && plan.startDate && plan.endDate) {
    if (date < plan.startDate || date > plan.endDate) {
      const s = isoToThai(plan.startDate), e = isoToThai(plan.endDate);
      alert(`วันที่อยู่นอกช่วงทริป (${s} – ${e})\nกรุณาแก้วันที่ให้ถูกต้องค่ะ`);
      return;
    }
  }

  if (editingBlockId) {
    const idx = plan.blocks.findIndex(x => x.id === editingBlockId);
    if (idx >= 0) plan.blocks[idx] = { ...plan.blocks[idx], ...b };
  } else {
    plan.blocks.push({ id: uid(), on: true, ...b });
  }

  save(); closeBlockSheet(); renderPlan();
}

function deleteBlock() {
  if (!editingBlockId) return;
  const plan = getPlan();
  if (!plan || !confirm('ลบบล็อคนี้?')) return;
  plan.blocks = plan.blocks.filter(b => b.id !== editingBlockId);
  save(); closeBlockSheet(); renderPlan();
}

function toggleBlock(blockId) {
  const plan = getPlan();
  const b    = plan?.blocks?.find(x => x.id === blockId);
  if (!b) return;
  b.on = !b.on;
  save(); renderPlan();
}
function togglePaid(blockId) {
  const plan = getPlan();
  const b    = plan?.blocks?.find(x => x.id === blockId);
  if (!b) return;
  b.paid = !b.paid;
  save(); renderPlan();
}

// ─────────────────────────────────
function getPlan(id) {
  return data.plans.find(p => p.id === (id || currentPlanId));
}

function planTotal(plan) {
  return (plan.blocks || []).filter(b => b.on).reduce((s, b) => s + (Number(b.cost)||0), 0);
}
function exportPDF() {
  const plan = getPlan();
  if (!plan) return;
  const adults   = plan.adults ?? plan.travelers ?? 1;
  const children = plan.children || 0;
  const total    = planTotal(plan);
  const dates    = dateRange(plan.startDate, plan.endDate);

  const dayRows = dates.map(date => {
    const d = new Date(date + 'T12:00:00');
    const dayLabel = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
    const blocks = (plan.blocks || [])
      .filter(b => b.date === date)
      .sort((a, b) => toMin(startTime(a)) - toMin(startTime(b)));
    if (!blocks.length) return '';
    const daySum = blocks.filter(b => b.on).reduce((s, b) => s + evalExpr(String(b.cost ?? '')), 0);

    const blockRows = blocks.map(b => {
      const cfg = TC[b.type] || TC.free;
      const cost = evalExpr(String(b.cost ?? ''));
      const timeStr = blockTimeStr(b);
      return `<tr style="border-bottom:1px solid #eee">
        <td style="padding:6px 8px;font-size:13px">${cfg.icon} ${esc(b.label || cfg.label)}</td>
        <td style="padding:6px 8px;font-size:12px;color:#666">${esc(timeStr)}</td>
        <td style="padding:6px 8px;font-size:12px;color:#666">${esc(b.note || '')}</td>
        <td style="padding:6px 8px;font-size:13px;text-align:right;font-weight:600;color:${b.on ? cfg.color : '#999'}">${cost > 0 || b.cost !== '' ? '฿' + fmt(cost) : ''}</td>
        <td style="padding:6px 8px;font-size:11px;text-align:center;color:${b.paid ? '#22c55e' : '#ccc'}">${b.paid ? '💳' : '—'}</td>
      </tr>`;
    }).join('');

    return `
    <div style="margin-bottom:24px;break-inside:avoid">
      <div style="background:#f8f9fa;border-left:4px solid #f59e0b;padding:8px 12px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700;font-size:14px">${dayLabel}</span>
        ${daySum > 0 ? `<span style="font-weight:700;color:#d97706">฿${fmt(daySum)}</span>` : ''}
      </div>
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="background:#f1f5f9;font-size:11px;color:#888">
            <th style="padding:4px 8px;text-align:left;font-weight:600">รายการ</th>
            <th style="padding:4px 8px;text-align:left;font-weight:600">เวลา</th>
            <th style="padding:4px 8px;text-align:left;font-weight:600">หมายเหตุ</th>
            <th style="padding:4px 8px;text-align:right;font-weight:600">ค่าใช้จ่าย</th>
            <th style="padding:4px 8px;text-align:center;font-weight:600">จ่ายแล้ว</th>
          </tr>
        </thead>
        <tbody>${blockRows}</tbody>
      </table>
    </div>`;
  }).join('');

  // category summary
  const groups = {};
  for (const b of plan.blocks || []) {
    if (!b.on) continue;
    if (!groups[b.type]) groups[b.type] = 0;
    groups[b.type] += evalExpr(String(b.cost ?? ''));
  }
  const summaryRows = Object.entries(TC).map(([type, cfg]) => {
    if (!groups[type]) return '';
    return `<tr><td style="padding:4px 8px">${cfg.icon} ${cfg.label}</td>
      <td style="padding:4px 8px;text-align:right;font-weight:600;color:${cfg.color}">฿${fmt(groups[type])}</td>
      ${adults > 1 ? `<td style="padding:4px 8px;text-align:right;color:#666">฿${fmt(Math.round(groups[type]/adults))}/คน</td>` : '<td></td>'}
    </tr>`;
  }).filter(Boolean).join('');

  const peopleStr = children > 0 ? `${adults} ผู้ใหญ่ + ${children} เด็ก` : `${adults} คน`;

  const html = `<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
  <title>${esc(plan.name || 'Itinerary')}</title>
  <style>
    body { font-family: 'Sarabun', sans-serif; color: #1a1a1a; max-width: 800px; margin: 0 auto; padding: 24px; }
    @media print { body { padding: 0; } button { display: none; } }
    table { border-collapse: collapse; }
    tr:hover { background: #f9fafb; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  </head><body>
  <button onclick="window.print()" style="float:right;background:#f59e0b;color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit">🖨 พิมพ์ / บันทึก PDF</button>
  <h1 style="font-size:22px;font-weight:700;margin:0 0 4px">${esc(plan.name || 'Itinerary')}</h1>
  <p style="color:#666;font-size:13px;margin:0 0 20px">${dateRangeStr(plan.startDate, plan.endDate)} · ${peopleStr}</p>

  ${dayRows}

  <div style="margin-top:32px;border-top:2px solid #e5e7eb;padding-top:16px">
    <h2 style="font-size:15px;font-weight:700;margin:0 0 12px">สรุปค่าใช้จ่าย (ที่เลือก)</h2>
    <table style="width:100%;max-width:360px">
      <tbody>${summaryRows}</tbody>
      <tfoot>
        <tr style="border-top:2px solid #e5e7eb;font-weight:700">
          <td style="padding:8px 8px">รวมทั้งหมด</td>
          <td style="padding:8px 8px;text-align:right;color:#d97706;font-size:16px">฿${fmt(total)}</td>
          ${adults > 1 ? `<td style="padding:8px 8px;text-align:right;color:#d97706">฿${fmt(Math.round(total/adults))}/คน</td>` : '<td></td>'}
        </tr>
      </tfoot>
    </table>
  </div>
  </body></html>`;

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.target   = '_blank';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function duplicatePlan() {
  const plan = getPlan();
  if (!plan) return;
  const copy = JSON.parse(JSON.stringify(plan));
  copy.id     = uid();
  copy.name   = (copy.name || 'แผน') + ' (คัดลอก)';
  copy.blocks = (copy.blocks || []).map(b => ({ ...b, id: uid() }));
  data.plans.push(copy);
  save();
  navigate('plan', copy.id);
}

function startTime(b) {
  return b.startTime || b.checkinTime || '00:00';
}

function endMin(b, forNextDay) {
  if (b.type === 'hotel') {
    if (forNextDay) {
      // checkout day → show until checkout time; middle nights → full day
      return b._hotelLastDay ? toMin(b.checkoutTime || '11:00') : 1440;
    }
    return 1440; // checkin day: extend to midnight
  }
  if (!b.endTime) return toMin(startTime(b)) + 60;
  const e = toMin(b.endTime);
  const s = toMin(startTime(b));
  if (forNextDay) return e;
  return e > s ? e : 1440;
}
function isOvernight(b) {
  if (b.type === 'hotel') return true;
  if (!b.startTime || !b.endTime) return false;
  return toMin(b.endTime) < toMin(b.startTime);
}
function prevDate(date) {
  const d = new Date(date + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}
function addDays(date, n) {
  const d = new Date(date + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function toMin(t = '00:00') {
  const [h, m] = t.split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

function blockTimeStr(b) {
  if (b.type === 'transit') {
    const route = b.from && b.to ? `${b.from} → ${b.to}` : '';
    const times = b.startTime && b.endTime ? `${b.startTime}–${b.endTime}` : '';
    return [route, times].filter(Boolean).join(' · ');
  }
  if (b.type === 'hotel') return `เช็คอิน ${b.checkinTime||'14:00'} · เช็คเอาท์ ${b.checkoutTime||'11:00'} · ${b.nights||1} คืน`;
  if (b.startTime && b.endTime) return `${b.startTime}–${b.endTime}`;
  if (b.startTime) return b.startTime;
  return '';
}

function dateRange(start, end) {
  if (!start || !end) return [];
  const out = [], s = new Date(start + 'T12:00:00'), e = new Date(end + 'T12:00:00');
  for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1))
    out.push(d.toISOString().slice(0, 10));
  return out;
}

function dateRangeStr(start, end) {
  if (!start) return 'ยังไม่กำหนดวัน';
  const s  = new Date(start + 'T12:00:00');
  const sy = s.getFullYear() + 543;
  if (!end || start === end) return `${s.getDate()} ${MONTHS[s.getMonth()]} ${sy}`;
  const e  = new Date(end + 'T12:00:00');
  const ey = e.getFullYear() + 543;
  if (sy === ey) {
    return s.getMonth() === e.getMonth()
      ? `${s.getDate()}–${e.getDate()} ${MONTHS[e.getMonth()]} ${sy}`
      : `${s.getDate()} ${MONTHS[s.getMonth()]} – ${e.getDate()} ${MONTHS[e.getMonth()]} ${sy}`;
  }
  return `${s.getDate()} ${MONTHS[s.getMonth()]} ${sy} – ${e.getDate()} ${MONTHS[e.getMonth()]} ${ey}`;
}

function fmt(n) { return Math.round(n).toLocaleString(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function evalExpr(s) {
  if (!s) return 0;
  if (!/^[\d\s\+\-\*\/\.\(\)]+$/.test(s)) return parseFloat(s) || 0;
  try {
    const r = Function('"use strict";return(' + s + ')')();
    return isFinite(r) && r >= 0 ? r : 0;
  } catch(e) { return 0; }
}
function previewCost(inp) {
  const el = document.getElementById('bs-cost-preview');
  const s  = inp.value.trim();
  const hasOp = /[\+\-\*\/]/.test(s);
  if (!s || !hasOp) { el.classList.add('hidden'); return; }
  const result = evalExpr(s);
  if (result > 0) {
    el.textContent = `= ฿${fmt(result)}`;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

function shiftDate(delta) {
  const inp = document.getElementById('bs-date');
  const iso = thaiToISO(inp.value);
  const base = iso || (getPlan()?.startDate) || new Date().toISOString().slice(0,10);
  const d = new Date(base + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  inp.value = isoToThai(d.toISOString().slice(0,10));
}
function fmtDate(inp) {
  const d = inp.value.replace(/\D/g,'').slice(0,8);
  if (d.length <= 2) inp.value = d;
  else if (d.length <= 4) inp.value = d.slice(0,2) + '/' + d.slice(2);
  else inp.value = d.slice(0,2) + '/' + d.slice(2,4) + '/' + d.slice(4);
}
function thaiToISO(s) {
  if (!s || s.length < 8) return '';
  const [dd, mm, yy] = s.split('/').map(Number);
  if (!dd || !mm || !yy) return '';
  const gy = yy > 2300 ? yy - 543 : yy;
  return `${gy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}
function isoToThai(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  if (!y) return '';
  return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y + 543}`;
}

  document.getElementById(name + '-backdrop').classList.add('open');
  document.getElementById(name + '-sheet').classList.add('open');
}

  document.getElementById(name + '-backdrop').classList.remove('open');
  document.getElementById(name + '-sheet').classList.remove('open');
}
