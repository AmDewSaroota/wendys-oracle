<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamina Credits Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e1a;
    color: #c9d1e0;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    min-height: 100vh;
    padding: 32px 24px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .header-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    color: #e2e8f0;
    letter-spacing: 0.02em;
  }

  h1 span {
    color: #6366f1;
  }

  .subtitle {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: #0f1629;
    border: 1px solid #1e2a42;
    border-radius: 10px;
    padding: 14px 20px;
    min-width: 160px;
  }

  .stat-label {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    color: #06b6d4;
  }

  .stat-value.indigo { color: #818cf8; }
  .stat-value.green  { color: #34d399; }

  /* Add form */
  .add-section {
    background: #0f1629;
    border: 1px solid #1e2a42;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }

  .add-section h2 {
    font-size: 13px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }

  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 180px;
  }

  label {
    font-size: 11px;
    color: #94a3b8;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  input, select {
    background: #0a0e1a;
    border: 1px solid #1e2a42;
    border-radius: 8px;
    color: #e2e8f0;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-size: 14px;
    padding: 9px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus {
    border-color: #6366f1;
  }

  input::placeholder {
    color: #334155;
  }

  .btn-add {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 24px;
    white-space: nowrap;
    transition: opacity 0.2s;
    align-self: flex-end;
  }

  .btn-add:hover { opacity: 0.85; }

  /* Table */
  .table-wrap {
    background: #0f1629;
    border: 1px solid #1e2a42;
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: #0a0e1a;
    border-bottom: 1px solid #1e2a42;
  }

  th {
    color: #64748b;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 14px 18px;
    text-align: left;
    text-transform: uppercase;
  }

  tbody tr {
    border-bottom: 1px solid #131b2e;
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #141e33; }

  td {
    font-size: 14px;
    padding: 14px 18px;
    vertical-align: middle;
  }

  .td-email {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #a5b4fc;
  }

  .td-credits {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 15px;
  }

  .credits-high  { color: #34d399; }
  .credits-mid   { color: #fbbf24; }
  .credits-low   { color: #f87171; }

  .td-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #64748b;
  }

  .td-renew {
    font-size: 13px;
    color: #06b6d4;
  }

  .badge-renew {
    background: #0e2433;
    border: 1px solid #0e4059;
    border-radius: 6px;
    color: #38bdf8;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 3px 10px;
    display: inline-block;
  }

  .btn-delete {
    background: none;
    border: 1px solid #2d1e1e;
    border-radius: 6px;
    color: #64748b;
    cursor: pointer;
    font-size: 12px;
    padding: 4px 10px;
    transition: all 0.2s;
  }

  .btn-delete:hover {
    background: #3b1c1c;
    border-color: #f87171;
    color: #f87171;
  }

  .btn-update {
    background: none;
    border: 1px solid #1e2a42;
    border-radius: 6px;
    color: #818cf8;
    cursor: pointer;
    font-size: 12px;
    padding: 4px 10px;
    margin-right: 6px;
    transition: all 0.2s;
  }

  .btn-update:hover {
    background: #1e1f42;
    border-color: #6366f1;
    color: #a5b4fc;
  }

  .actions { white-space: nowrap; }

  /* Renewal countdown */
  .days-left {
    font-size: 11px;
    margin-top: 2px;
    color: #475569;
  }

  .days-soon { color: #fbbf24; }

  /* Empty state */
  .empty {
    padding: 48px;
    text-align: center;
    color: #334155;
    font-size: 14px;
  }

  /* Update modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: #0f1629;
    border: 1px solid #1e2a42;
    border-radius: 14px;
    padding: 28px 32px;
    width: 400px;
    max-width: 90vw;
  }

  .modal h3 {
    font-size: 16px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 20px;
  }

  .modal-email {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #818cf8;
    margin-bottom: 16px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: none;
    border: 1px solid #1e2a42;
    border-radius: 8px;
    color: #64748b;
    cursor: pointer;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-size: 14px;
    padding: 8px 18px;
    transition: all 0.2s;
  }

  .btn-cancel:hover { border-color: #334155; color: #94a3b8; }

  .btn-save {
    background: linear-gradient(135deg, #0891b2, #06b6d4);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 24px;
    transition: opacity 0.2s;
  }

  .btn-save:hover { opacity: 0.85; }

  .timestamp {
    font-size: 11px;
    color: #334155;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 24px;
    text-align: right;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">✦</div>
  <div>
    <h1><span>Dreamina</span> Credits Tracker</h1>
    <div class="subtitle">NDF · บันทึก Account & Credit คงเหลือ</div>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat-card">
    <div class="stat-label">Accounts</div>
    <div class="stat-value indigo" id="statAccounts">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total Credits</div>
    <div class="stat-value" id="statTotal">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Avg / Account</div>
    <div class="stat-value green" id="statAvg">0</div>
  </div>
</div>

<div class="add-section">
  <h2>+ เพิ่ม / อัปเดต Account</h2>
  <div class="form-row">
    <div class="form-group" style="flex:2; min-width:240px;">
      <label>Email / Account ID</label>
      <input type="email" id="inEmail" placeholder="email@example.com">
    </div>
    <div class="form-group" style="max-width:130px;">
      <label>Credits คงเหลือ</label>
      <input type="number" id="inCredits" placeholder="0" min="0">
    </div>
    <div class="form-group" style="max-width:150px;">
      <label>วันรีนิว (วันที่)</label>
      <select id="inRenewDay">
        <option value="">-- เลือกวัน --</option>
        <option value="1">วันที่ 1</option>
        <option value="5">วันที่ 5</option>
        <option value="10">วันที่ 10</option>
        <option value="12">วันที่ 12</option>
        <option value="15">วันที่ 15</option>
        <option value="20">วันที่ 20</option>
        <option value="25">วันที่ 25</option>
        <option value="28">วันที่ 28</option>
      </select>
    </div>
    <button class="btn-add" onclick="addEntry()">บันทึก</button>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Email / Account ID</th>
        <th>Credits คงเหลือ</th>
        <th>วันที่บันทึก</th>
        <th>รีนิวทุกวันที่</th>
        <th>รีนิวครั้งถัดไป</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="7" class="empty">ยังไม่มีข้อมูล — กรอกฟอร์มด้านบนเพื่อเริ่มบันทึก</td></tr>
    </tbody>
  </table>
</div>

<div class="timestamp" id="lastUpdated"></div>

<!-- Update Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>อัปเดต Credits</h3>
    <div class="modal-email" id="modalEmail"></div>
    <div class="form-group">
      <label>Credits คงเหลือ (ปัจจุบัน)</label>
      <input type="number" id="modalCredits" placeholder="0" min="0">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-save" onclick="saveUpdate()">บันทึก</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'dreamina_credits_v1';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;

// Merge defaults: add any missing account on load (won't overwrite existing)
const DEFAULTS = [
  { email: 'fortaldrive@fortalinter.com', credits: 55,   renewDay: 12 },
  { email: 'googledrive@ndfdev.com',      credits: 8500, renewDay: 20 },
  { email: 'ndfdev.ai@gmail.com',         credits: 450,  renewDay: 4  },
  { email: 'Siamdirector@siamshort.com',  credits: 1500, renewDay: 27 },
  { email: 'production001@siamshort.com',          credits: 290,  renewDay: 15 },
  { email: 'aidramamusicthaiproject@gmail.com',    credits: 37200, renewDay: 27 },
  { email: 'Jimeng (CN Account)',                  credits: 100,  renewDay: 7  },
];
let changed = false;
DEFAULTS.forEach((def, i) => {
  if (!data.find(r => r.email === def.email)) {
    data.push({ id: Date.now() + i, ...def, recordedAt: new Date().toISOString() });
    changed = true;
  }
});
if (changed) save();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

function formatDate(iso) {
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear() + 543; // พ.ศ.
  const hh = String(d.getHours()).padStart(2,'0');
  const mn = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} ${hh}:${mn}`;
}

function getNextRenew(day) {
  if (!day) return null;
  const now = new Date();
  const thisMonth = new Date(now.getFullYear(), now.getMonth(), day);
  if (thisMonth <= now) {
    return new Date(now.getFullYear(), now.getMonth() + 1, day);
  }
  return thisMonth;
}

function daysUntil(date) {
  if (!date) return null;
  const now = new Date();
  const diff = date - now;
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

function creditClass(n) {
  if (n > 50) return 'credits-high';
  if (n > 20) return 'credits-mid';
  return 'credits-low';
}

function render() {
  const tbody = document.getElementById('tableBody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">ยังไม่มีข้อมูล — กรอกฟอร์มด้านบนเพื่อเริ่มบันทึก</td></tr>';
    updateStats();
    return;
  }

  tbody.innerHTML = data.map((row, i) => {
    const next = getNextRenew(row.renewDay);
    const days = daysUntil(next);
    const nextStr = next
      ? `${String(next.getDate()).padStart(2,'0')}/${String(next.getMonth()+1).padStart(2,'0')}/${next.getFullYear()+543}`
      : '-';
    const daysLabel = days !== null
      ? `<div class="days-left ${days <= 5 ? 'days-soon' : ''}">อีก ${days} วัน</div>`
      : '';

    return `
    <tr>
      <td style="color:#334155; font-family: 'IBM Plex Mono',monospace; font-size:12px;">${i+1}</td>
      <td class="td-email">${row.email}</td>
      <td>
        <span class="td-credits ${creditClass(row.credits)}">${row.credits}</span>
        <span style="color:#334155; font-size:11px; margin-left:4px;">credit</span>
      </td>
      <td class="td-date">${formatDate(row.recordedAt)}</td>
      <td>
        ${row.renewDay
          ? `<span class="badge-renew">วันที่ ${row.renewDay}</span>`
          : '<span style="color:#334155">-</span>'}
      </td>
      <td class="td-date">
        ${nextStr}
        ${daysLabel}
      </td>
      <td class="actions">
        <button class="btn-update" onclick="openModal(${row.id})">อัปเดต</button>
        <button class="btn-delete" onclick="deleteEntry(${row.id})">ลบ</button>
      </td>
    </tr>`;
  }).join('');

  updateStats();
  document.getElementById('lastUpdated').textContent =
    'อัปเดตล่าสุด: ' + formatDate(new Date().toISOString());
}

function updateStats() {
  const total = data.reduce((s, r) => s + r.credits, 0);
  const avg = data.length ? Math.round(total / data.length) : 0;
  document.getElementById('statAccounts').textContent = data.length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAvg').textContent = avg;
}

function addEntry() {
  const email = document.getElementById('inEmail').value.trim();
  const credits = parseInt(document.getElementById('inCredits').value);
  const renewDay = parseInt(document.getElementById('inRenewDay').value) || null;

  if (!email) { alert('กรุณากรอก Email'); return; }
  if (isNaN(credits) || credits < 0) { alert('กรุณากรอก Credits ให้ถูกต้อง'); return; }

  // Check duplicate
  const existing = data.find(r => r.email === email);
  if (existing) {
    existing.credits = credits;
    existing.recordedAt = new Date().toISOString();
    if (renewDay) existing.renewDay = renewDay;
  } else {
    data.push({ id: Date.now(), email, credits, recordedAt: new Date().toISOString(), renewDay });
  }

  save();
  document.getElementById('inEmail').value = '';
  document.getElementById('inCredits').value = '';
  document.getElementById('inRenewDay').value = '';
}

function deleteEntry(id) {
  if (!confirm('ลบ account นี้?')) return;
  data = data.filter(r => r.id !== id);
  save();
}

function openModal(id) {
  editingId = id;
  const row = data.find(r => r.id === id);
  document.getElementById('modalEmail').textContent = row.email;
  document.getElementById('modalCredits').value = row.credits;
  document.getElementById('modalOverlay').classList.add('active');
  document.getElementById('modalCredits').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
}

function saveUpdate() {
  const credits = parseInt(document.getElementById('modalCredits').value);
  if (isNaN(credits) || credits < 0) { alert('กรุณากรอก Credits ให้ถูกต้อง'); return; }
  const row = data.find(r => r.id === editingId);
  row.credits = credits;
  row.recordedAt = new Date().toISOString();
  save();
  closeModal();
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
